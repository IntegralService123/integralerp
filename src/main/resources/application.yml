spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: integralservice

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jwt:
    secret: ${JWT_SECRET}
    expiration: 7200000 # 2 horas em ms

  usuarioadmin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
